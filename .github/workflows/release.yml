name: Release
# Publishes every public package under packages/* whose version is not on npm yet,
# when a tag like v0.1.1 is pushed. npm trusted publishing (OIDC, through id-token: write)
# authenticates packages configured for this workflow and the `npm` environment; NPM_TOKEN in
# that environment, whose deployment policy only admits v* tags, is the fallback until then.
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Publishing is irreversible: only a tag for the released version on a commit already on main.
      - name: Guard the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/platform/package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match packages/platform/package.json version $version"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG points at a commit that is not on main"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Build first: the generator test installs the packed adapter, which ships dist/.
      - run: bun run build
      - run: bun run test
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14; Node 24.0 shipped npm 11.3.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.19.1
      - name: Publish changed packages
        run: bun run scripts/publish.ts
        env:
          # Written to .npmrc by setup-node; npm only uses it when the OIDC exchange fails.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
