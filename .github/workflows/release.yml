name: Release
# Publishes every public package under packages/* whose version is not on npm yet,
# when a tag like v0.1.1 is pushed. Two jobs: `pack` installs, builds, tests and packs with no
# credentials; `publish` runs no dependency code and is the only one that can authenticate to
# npm. npm trusted publishing (OIDC, through id-token: write) covers packages configured for
# this workflow and the `npm` environment; NPM_TOKEN in that environment, whose deployment
# policy only admits v* tags, is the fallback until then.
on:
  push:
    tags: ['v*']
jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Publishing is irreversible: only a tag for the released version on a commit already on main.
      - name: Guard the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/platform/package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match packages/platform/package.json version $version"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG points at a commit that is not on main"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Build first: the generator test installs the packed adapter, which ships dist/.
      - run: bun run build
      - run: bun run test
      - run: bun run scripts/publish.ts pack packed
      - uses: actions/upload-artifact@v4
        with:
          name: packed
          path: packed/
          if-no-files-found: error
  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      # Only for scripts/ and packages/*/package.json: nothing is installed or built in this job.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Third-party actions in the job that can publish are pinned by commit, not by a movable tag.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14; Node 24.0 shipped npm 11.3.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.19.1
      - uses: actions/download-artifact@v4
        with:
          name: packed
          path: packed
      - name: Publish changed packages
        run: bun run scripts/publish.ts publish packed
        env:
          # Written to .npmrc by setup-node; npm only uses it when the OIDC exchange fails.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
